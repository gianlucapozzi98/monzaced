seoTitolo: Chi siamo | Monza CED, CED a Monza
seoDescrizione: "Monza CED, Centro di Elaborazione Dati in Via Solferino 11 a Monza: consulenza fiscale e amministrativa per cittadini, professionisti e aziende."
titolo: Chi siamo
sottotitolo: Un professionista al servizio della famiglia.
testo: |-
  Monza CED è un Centro di Elaborazione Dati. Da anni siamo al servizio di cittadini, professionisti e aziende con consulenza specializzata e gestione di servizi fiscali e amministrativi.

  Il nostro impegno è offrire soluzioni su misura, affidabili e sempre in linea con le ultime normative, per sostenerti nelle esigenze di tutti i giorni e in quelle più importanti.

  La nostra missione è semplice: facilitare la tua vita professionale e personale. Siamo qui per toglierti il peso della burocrazia dalle spalle, così puoi concentrarti su ciò che conta davvero.
valori:
  - titolo: Competenza
    testo: È la base di ogni servizio. Il nostro team si aggiorna di continuo su norme e strumenti, per offrirti soluzioni accurate in ambito fiscale e amministrativo.
  - titolo: Professionalità
    testo: Ogni cliente è accolto con un approccio serio ed etico, con la massima attenzione alle sue esigenze.
  - titolo: Affidabilità
    testo: La fiducia dei clienti è il bene più prezioso. Rispettiamo gli accordi presi e diamo risposte chiare, su cui puoi contare.
  - titolo: Sicurezza
    testo: La sicurezza dei tuoi dati è fondamentale. Proteggiamo la tua privacy e le tue informazioni.
servizi: |-
  Ci occupiamo di dichiarazioni dei redditi, ISEE, IMU e locazioni, colf e badanti, successioni, contabilità per società, ditte e professionisti, dimissioni, disoccupazione, ricostituzioni reddituali, invalidità civile e assegno sociale, pensioni, assegni familiari e di maternità.
colfTitolo: Cerchi una badante o una colf? La troviamo noi.
colfTesto: Ricerca e assunzione di figure referenziate, gestione del contratto, calcolo del prospetto paga e dei versamenti INPS. Pensiamo a tutto noi.
