titolo: Contatti
testo: Per qualsiasi domanda o per fissare un appuntamento, chiamaci o scrivici. Ti rispondiamo nel più breve tempo possibile.
prenotaTitolo: Prenota una consulenza
prenotaTesto: Lasciaci nome, telefono e il servizio che ti interessa. Lo studio ti richiama per fissare l'appuntamento.
caricaTitolo: Carica i documenti
caricaTesto: Scegli il servizio, spunta i documenti che hai e caricali in modo protetto. Solo lo studio potrà vederli.
conferma: Grazie, abbiamo ricevuto la tua richiesta. Lo studio ti ricontatterà nel più breve tempo possibile.
