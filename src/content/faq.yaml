domande:
  - domanda: Come prenoto una consulenza?
    risposta: |-
      Con il modulo [Prenota una consulenza](/prenota) oppure chiamando lo **039 326628** dal lunedì al venerdì, 9:30–13:00 e 14:00–18:00.
  - domanda: Quali documenti devo portare?
    risposta: |-
      Nella pagina di ogni servizio trovi la checklist dei documenti. Se non sei sicuro, chiamaci: te lo diciamo noi.
  - domanda: Posso inviare i documenti online in sicurezza?
    risposta: |-
      Sì, con [Carica i documenti](/carica-documenti). I file vengono controllati dall'antivirus e conservati in un archivio privato e cifrato in Europa. Solo lo studio può aprirli, con accesso protetto. Alla fine ricevi un codice pratica. Non inviare documenti per email.
  - domanda: Quali sono gli orari?
    risposta: Dal lunedì al venerdì, dalle 9:30 alle 13:00 e dalle 14:00 alle 18:00.
  - domanda: Dove siete?
    risposta: In Via Solferino 11, 20900 Monza (MB).
  - domanda: Quanto tempo serve per una pratica?
    risposta: Dipende dal tipo di pratica e dai documenti. Chiedi allo studio in consulenza.
  - domanda: Non trovo il servizio che mi serve.
    risposta: |-
      Contattaci comunque: siamo disponibili a darti tutte le informazioni e a parlare delle tue esigenze.
