valoriTitolo: Come lavoriamo
valori:
  - titolo: Esperienza e serietà
    testo: Affidati all'esperienza di professionisti per un servizio affidabile e personalizzato.
  - titolo: Aggiornati alle ultime normative
    testo: Seguiamo le regole fiscali e amministrative che cambiano, perché tu non debba farlo da solo.
  - titolo: La tua tranquillità
    testo: La nostra priorità è farti sentire tranquillo. Siamo qui per toglierti il peso della burocrazia.
passiTitolo: Come si inizia
passi:
  - titolo: Scegli il servizio
    testo: Trova la tua pratica qui sul sito, oppure chiamaci e ti indirizziamo noi.
  - titolo: Prenota o carica i documenti
    testo: Prenota una consulenza e, se vuoi, invia già i documenti in modo protetto.
  - titolo: Ce ne occupiamo noi
    testo: Lo studio prende in carico la richiesta e ti ricontatta per i passi successivi.
caricaTitolo: Carica i documenti, senza uscire di casa
caricaTesto: Scegli il servizio, spunta i documenti che hai e caricali dal computer o dal telefono. I file arrivano solo allo studio, in un archivio protetto.
chiSiamoTitolo: Un professionista al servizio della famiglia
chiSiamoTesto: |-
  Monza CED è un Centro di Elaborazione Dati per la consulenza e la gestione di una vasta gamma di servizi fiscali e amministrativi.

  Ci rivolgiamo a cittadini, lavoratori, pensionati e famiglie che cercano un servizio affidabile, personalizzato e aggiornato alle ultime normative.
faqTitolo: Domande frequenti
chiusuraTitolo: "Parliamone: *prenota una consulenza.*"
chiusuraTesto: Se non hai trovato esattamente quello che ti serve, contattaci. Siamo disponibili a darti tutte le informazioni e a parlare delle tue esigenze.
