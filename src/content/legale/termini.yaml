titolo: Termini e condizioni
descrizione: "Condizioni d'uso del sito di Monza CED, del servizio di caricamento documenti e della richiesta di consulenza."
bozza: true
aggiornatoIl: 2026-11-24
sezioni:
  - titolo: Chi siamo
    testo: |-
      Il sito è gestito da Monza CED Srl, Via Solferino 11, 20900 Monza (MB), Partita IVA 12488810966.
  - titolo: Contenuti informativi
    testo: |-
      Le pagine dei servizi hanno scopo informativo e non sostituiscono una consulenza. Le norme fiscali e previdenziali cambiano spesso: ogni pagina riporta la data dell'ultimo aggiornamento del testo. **Verifica sempre la tua situazione con lo studio.** Non garantiamo esiti, importi, rimborsi o tempi delle pratiche, che dipendono anche da enti terzi.
  - titolo: Richiesta di consulenza
    testo: |-
      Il modulo "Prenota una consulenza" invia una **richiesta**: l'appuntamento è fissato solo quando lo studio ti ricontatta e lo conferma. Inviare la richiesta non comporta costi né impegni.
  - titolo: Caricamento dei documenti
    testo: |-
      - Puoi caricare solo documenti che ti riguardano o che hai titolo a trasmettere (per esempio come genitore, tutore o delegato), e solo per la pratica indicata.
      - Formati ammessi: PDF, JPG e PNG. Il numero e la dimensione massima dei file sono indicati nel modulo.
      - Ogni file è controllato da un antivirus: i file sospetti o non ammessi vengono rifiutati e cancellati.
      - Al termine ricevi un **codice pratica**. Il caricamento non equivale all'accettazione dell'incarico: lo studio ti ricontatta per i passi successivi.
      - Sei responsabile della correttezza e completezza dei documenti che invii.
      - Conservazione e cancellazione dei file sono descritte nell'[informativa sulla privacy](/privacy).
  - titolo: Uso corretto del sito
    testo: |-
      È vietato usare il sito per inviare contenuti illeciti, file dannosi o richieste automatiche. Possiamo limitare gli invii per proteggere il servizio.
  - titolo: Proprietà intellettuale
    testo: |-
      Testi, logo e grafica appartengono a Monza CED Srl. Le fotografie sono di terzi, usate con licenza: vedi la pagina [Crediti](/crediti).
  - titolo: Legge applicabile
    testo: |-
      Si applica la legge italiana. [DA VALIDARE con il legale dello studio.]
