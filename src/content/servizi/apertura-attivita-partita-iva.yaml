perChiNota: ""
cosaFacciamo:
  - Contabilità ordinaria e semplificata, compreso il bilancio d'esercizio.
  - Assistenza specifica per il regime forfettario, con dichiarazioni e agevolazioni previste.
  - Fatturazione elettronica completa (redazione, trasmissione, ricezione e conservazione a norma), con un gestionale online a disposizione.
  - Apertura, variazione e cessazione della Partita IVA, con registrazioni all'Agenzia delle Entrate e posizioni INPS e INAIL.
  - Consulenza fiscale e preparazione dei modelli dichiarativi, con invio telematico.
  - Adempimenti presso Agenzia delle Entrate, Camera di Commercio e SUAP.
  - Operazioni internazionali, compresi i modelli Intrastat e le operazioni con soggetti non residenti.
  - Elaborazione delle paghe e adempimenti collegati.
