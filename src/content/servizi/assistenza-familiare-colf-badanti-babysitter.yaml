titolo: Assistenza familiare
titoloPagina: "Assistenza familiare: colf, badanti e babysitter"
riassunto: Ricerca, assunzione e gestione di colf, badanti e babysitter, con buste paga e contributi INPS.
gruppo: famiglia
situazioni:
  - famiglia
  - pensione
icona: aiuto
immagine: famiglia
