approfondimenti:
  - titolo: Autoliquidazione INAIL
    testo: |-
      Ogni azienda deve dichiarare ogni anno le retribuzioni imponibili per determinare il premio assicurativo INAIL.
  - titolo: Modello CU (Certificazione Unica)
    testo: |-
      È un documento fondamentale per i lavoratori dipendenti: attesta le retribuzioni percepite, le ritenute fiscali e i contributi previdenziali versati.
  - titolo: Modello 770
    testo: |-
      Riassume i dati fiscali, previdenziali e assicurativi gestiti dai sostituti d'imposta.
