approfondimenti:
  - titolo: Che cos'è l'estratto conto contributivo
    testo: |-
      È il documento che riporta tutto lo storico dei contributi versati da un lavoratore all'INPS. Serve a verificare che i dati registrati siano corretti, a calcolare l'importo della futura pensione e a individuare eventuali periodi mancanti o errati.
  - titolo: Come vedere lo storico lavorativo
    testo: |-
      Lo storico dei contributi si consulta sul sito dell'INPS, accedendo con le proprie credenziali digitali. Una volta entrati si può visualizzare e scaricare l'estratto contributivo. Se incontri difficoltà, ti aiutiamo nella consultazione.
