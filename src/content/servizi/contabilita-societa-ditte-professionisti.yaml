approfondimenti:
  - titolo: I regimi contabili
    testo: |-
      La scelta del regime contabile orienta tutta la gestione amministrativa e fiscale dell'attività. I principali:

      - **Regime ordinario:** adatto alle società di capitali, richiede una contabilità completa con bilancio annuale.
      - **Regime semplificato:** pensato per piccole imprese e professionisti, alleggerisce alcuni obblighi contabili.
      - **Regime forfettario:** vantaggi fiscali e semplificazioni per piccoli imprenditori e professionisti con determinati requisiti di reddito.
