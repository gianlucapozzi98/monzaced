  - Ti aiutiamo a scegliere la tipologia di contratto più adatta alle tue esigenze.
  - Seguiamo la registrazione del contratto.
  - Ti assistiamo nella scelta del regime di tassazione.
  - Ti seguiamo nelle fasi successive: proroghe, cessioni, rinegoziazioni e risoluzioni.
  - Ti aiutiamo a raccogliere e preparare i documenti.
