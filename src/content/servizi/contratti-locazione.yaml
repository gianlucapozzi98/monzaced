approfondimenti:
  - titolo: Tipologie di contratto
    testo: |-
      Esistono diverse tipologie di contratto di locazione. Le più comuni sono il contratto standard, il contratto a canone libero, il contratto a canone concordato (detto anche "convenzionato") e il contratto per uso transitorio. Ognuna ha conseguenze legali e fiscali specifiche.
  - titolo: Tassazione - cedolare secca o Irpef
    testo: |-
      Il reddito da locazione può essere tassato in due modi:

      - con l'**Irpef**, ad aliquote progressive;
      - con la **cedolare secca**, un'imposta sostitutiva ad aliquota fissa.

      La scelta dipende da diversi fattori: il tipo di contratto, l'importo del canone e le preferenze personali nella gestione fiscale.
  - titolo: Dopo la registrazione
    testo: |-
      - **Proroga:** il rinnovo del contratto alla fine del periodo iniziale.
      - **Cessione:** il trasferimento dei diritti di locazione a un terzo.
      - **Rinegoziazione:** la modifica delle condizioni, per esempio del canone.
      - **Risoluzione:** la chiusura anticipata del contratto.

      Ognuna di queste fasi richiede una procedura specifica, che seguiamo con te nel rispetto della normativa.
faq:
  - domanda: Meglio cedolare secca o Irpef?
    risposta: |-
      Dipende dal tipo di contratto, dall'importo del canone e dalle tue preferenze: ne parliamo in consulenza.
