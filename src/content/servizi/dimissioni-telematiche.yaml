seo:
  titolo: Dimissioni telematiche a Monza | Monza CED
  descrizione: "Dimissioni online a Monza: verifichiamo i documenti e inviamo la pratica per te. Prenota una consulenza con Monza CED o carica i documenti."
introduzione: |-
  Niente code e niente attese: ti aiutiamo a presentare le dimissioni online in modo semplice e sicuro, gestendo la pratica correttamente e nel rispetto delle norme.

  Con la trasmissione telematica non servono scambi di carta né visite agli uffici.
perChi:
  - Tutti i lavoratori dipendenti
  - A tempo determinato o indeterminato
  - Part-time o full-time
perChiNota: ""
cosaFacciamo:
  - Prepariamo e verifichiamo con te i documenti necessari.
  - Ti supportiamo nella compilazione e nell'invio della pratica.
  - Ti aiutiamo a capire i tuoi diritti e le tue responsabilità al momento delle dimissioni.
  - Ti assistiamo dopo le dimissioni per liquidazione, documenti finali e certificazioni.
passaggi:
  - titolo: Verifica dei documenti
    testo: Controlliamo con te che tutto sia completo.
  - titolo: Compilazione e invio
    testo: Compiliamo la pratica e la trasmettiamo per via telematica.
  - titolo: Dopo le dimissioni
    testo: Ti seguiamo per liquidazione, documenti finali e certificazioni.
