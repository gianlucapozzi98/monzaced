documentiNota: |-
  Per l'Assegno per il Nucleo Familiare servono: documento d'identità e codice fiscale del richiedente, codici fiscali dei familiari a carico, attestazione ISEE in corso di validità con la relativa DSU, documentazione sulla composizione del nucleo familiare.
approfondimenti:
  - titolo: L'assegno di maternità
    testo: |-
      È una prestazione economica che sostiene le famiglie alla nascita o all'adozione di un bambino.
  - titolo: Maternità obbligatoria (congedo di maternità)
    testo: |-
      Prevede un periodo di astensione dal lavoro per le mamme lavoratrici che copre gli ultimi due mesi di gravidanza e i primi tre mesi dopo il parto. È un periodo tutelato per legge, durante il quale la lavoratrice riceve un'indennità pari al 100% della retribuzione.
  - titolo: Maternità facoltativa (congedo parentale)
    testo: |-
      Oltre al congedo obbligatorio, neomamme e neopapà hanno diritto al congedo parentale facoltativo, per un periodo massimo di sei mesi fino agli 8 anni di età del bambino, con un'indennità pari al 30% della retribuzione per i primi sei mesi.
  - titolo: Assegno per il Nucleo Familiare (ANF)
    testo: |-
      È una prestazione economica dell'INPS per lavoratori dipendenti, pensionati e, in alcuni casi, lavoratori autonomi con familiari a carico, quando il reddito complessivo del nucleo non supera determinate soglie stabilite ogni anno.

      L'importo dipende dal numero dei familiari a carico, dalla composizione del nucleo e dal reddito complessivo. Le tabelle con soglie e importi sono aggiornate ogni anno e pubblicate sul sito dell'INPS: ti aiutiamo a leggerle e a calcolare l'importo.

      Ti seguiamo nella raccolta dei documenti, nella compilazione e nella presentazione della domanda all'INPS, e negli aggiornamenti successivi se cambia la tua situazione familiare o economica.
