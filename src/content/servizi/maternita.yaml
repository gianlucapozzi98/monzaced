introduzione: |-
  Per le neomamme e i neopapà gestiamo l'assegno di maternità e il congedo di maternità, obbligatorio e facoltativo, guidandoti in ogni fase.

  Ti assistiamo anche nella richiesta dell'Assegno per il Nucleo Familiare (ANF).
perChi:
  - Mamme lavoratrici dipendenti
  - Lavoratrici autonome
  - Lavoratrici iscritte alla gestione separata INPS
  - Disoccupate e casalinghe, alle condizioni previste dalla normativa
perChiNota: ""
cosaFacciamo:
  - Consulenza personalizzata per capire i tuoi diritti e le prestazioni che ti spettano.
  - Raccolta e presentazione dei documenti: ci occupiamo noi degli aspetti burocratici.
  - Assistenza durante tutta la richiesta, dalla domanda iniziale all'erogazione dell'assegno e alla gestione del congedo.
