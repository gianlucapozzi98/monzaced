documentiNota: ""
approfondimenti:
  - titolo: A cosa serve l'ISEE
    testo: |-
      L'attestazione è valida per un anno e serve a stabilire l'accesso, per ogni componente del nucleo familiare, a prestazioni agevolate come:

      - assegno di maternità o per nuclei familiari numerosi
      - iscrizione all'asilo nido e ad altri servizi educativi per l'infanzia
      - mense scolastiche
      - prestazioni scolastiche (trasporto alunni, borse di studio e altre)
      - agevolazioni per le tasse universitarie
      - servizi socio-assistenziali domiciliari
      - servizi socio-assistenziali diurni e residenziali
      - agevolazioni per servizi di pubblica utilità (telefono, luce, gas, trasporti pubblici)
      - agevolazioni sui tributi locali
  - titolo: Chi fa parte del nucleo familiare
    testo: |-
      Ai fini ISEE il nucleo familiare comprende le persone legate da parentela, affinità o convivenza che hanno la stessa residenza: per esempio coniugi, figli, genitori, fratelli e altre situazioni familiari particolari. Capire chi ne fa parte è il primo passo per calcolare correttamente l'ISEE.
  - titolo: Come si ottiene la certificazione
    testo: |-
      Bisogna compilare l'apposito modulo e presentare la documentazione richiesta presso gli enti competenti: tra gli altri, la dichiarazione dei redditi, la documentazione sul patrimonio e gli altri documenti sulla situazione economica del nucleo.
faq:
  - domanda: Per quanto tempo vale l'ISEE?
    risposta: L'attestazione ISEE è valida per un anno.
  - domanda: Esiste un solo tipo di ISEE?
    risposta: |-
      No: ogni tipologia ha requisiti e procedure specifiche. Ti aiutiamo a scegliere quella più adatta.
