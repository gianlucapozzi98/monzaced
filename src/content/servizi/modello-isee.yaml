seo:
  titolo: Modello ISEE a Monza | Monza CED
  descrizione: "ISEE a Monza: ti aiutiamo con la compilazione e con i documenti per il nucleo familiare. Prenota una consulenza o carica i documenti online."
introduzione: |-
  L'ISEE è lo strumento che misura la situazione economica di un nucleo familiare. Ti spieghiamo in modo chiaro che cos'è, chi può richiederlo e come ottenerlo con il nostro aiuto.
perChi:
  - Famiglie e singole persone che vogliono accedere ad agevolazioni economiche o fiscali
  - Chi deve richiedere benefici previsti dalla normativa vigente
  - Enti come istituti di assistenza e strutture socio-sanitarie
perChiNota: ""
cosaFacciamo:
  - Ti guidiamo nella compilazione del modulo.
  - Ti aiutiamo a raccogliere i documenti necessari.
  - Ti aiutiamo a scegliere il tipo di ISEE più adatto alla tua situazione: ogni tipologia ha requisiti e procedure specifiche.
passaggi:
  - titolo: Capire chi fa parte del nucleo
    testo: Definiamo insieme il nucleo familiare ai fini ISEE.
  - titolo: Raccogliere i documenti
    testo: Redditi, patrimonio e altri documenti sulla situazione economica della famiglia.
  - titolo: Compilare e presentare il modulo
    testo: Compiliamo il modulo e lo presentiamo con la documentazione richiesta.
