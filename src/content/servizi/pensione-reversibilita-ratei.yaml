introduzione: |-
  La pensione di reversibilità e i ratei non riscossi sono un sostegno economico importante per i familiari superstiti. Ti guidiamo in ogni fase.
perChi:
  - Familiari superstiti di un lavoratore o di un pensionato deceduto con contributi sufficienti
  - Coniuge e figli
  - In alcuni casi altri familiari a carico, come genitori o fratelli, se rispettano i requisiti di legge
perChiNota: ""
cosaFacciamo:
  - Consulenza sulla pensione di reversibilità e sui ratei non riscossi.
  - Preparazione e presentazione della domanda tramite il modello precompilato sul sito dell'INPS.
  - Supporto nella raccolta dei documenti.
  - Consulenza per la richiesta dei ratei di pensione maturati e non riscossi.
