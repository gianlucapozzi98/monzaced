introduzione: |-
  Capire la propria posizione contributiva, calcolare l'età pensionabile, valutare i benefici previdenziali: ti offriamo assistenza e consulenza complete su contributi e pensioni.
perChi:
  - Chi sta per fare domanda di pensione
  - Chi vuole conoscere la propria posizione contributiva e pianificare il futuro
  - Pensionati che continuano a lavorare e a versare contributi
perChiNota: ""
cosaFacciamo:
  - Ti assistiamo nella preparazione e nella presentazione della domanda di pensione e ci interfacciamo con gli enti previdenziali.
  - Facciamo simulazioni dell'età pensionabile e dell'importo atteso, per pianificare con anticipo.
  - Verifichiamo le opportunità previste dalla legge: recupero di contributi non versati, cumulo contributivo, agevolazioni fiscali.
  - Per chi continua a lavorare dopo la pensione, consulenza sulle possibilità di aumentare l'assegno con ulteriori contributi.
