    nota: ""
documentiNota: ""
approfondimenti:
  - titolo: Che cos'è la dichiarazione di successione
    testo: |-
      È il documento da presentare all'Agenzia delle Entrate per comunicare il passaggio dei beni dal defunto agli eredi. Serve a definire legalmente i nuovi proprietari e a calcolare l'imposta di successione dovuta.

      Richiede una buona conoscenza delle norme fiscali e civili: dalla valutazione dei beni ereditati alla loro ripartizione tra gli eredi.
  - titolo: Imposta di successione
    testo: |-
      Le aliquote per eredi e legatari:

      - **Coniuge e parenti in linea retta: 4%.** Quota esente per eredi in linea retta e coniuge: € 1.000.000,00.
      - **Altri parenti fino al 4° grado, affini in linea retta e affini in linea collaterale fino al 3° grado: 6%.** Quota esente per fratelli e sorelle: € 100.000,00.
      - **Altri soggetti: 8%.**

      La quota esente per le persone con handicap grave è di € 1.500.000,00 (non cumulabile con le esenzioni precedenti).

      Le imposte vengono liquidate dall'Agenzia delle Entrate dopo la presentazione della dichiarazione.
  - titolo: Come si calcola
    testo: |-
      L'imposta cambia in base al grado di parentela tra il defunto e l'erede e al valore dei beni ereditati.
faq:
  - domanda: Entro quando va presentata?
    risposta: Entro 12 mesi dalla data del decesso.
  - domanda: Chi deve presentarla?
    risposta: Tutti gli eredi, i legatari o chi ha diritti sugli immobili ereditati.
