titolo: Successioni
titoloPagina: Dichiarazione di successione
riassunto: Ti seguiamo in ogni passaggio della dichiarazione di successione, dai documenti al calcolo dell'imposta.
gruppo: casa
situazioni:
  - famiglia
  - casa
icona: albero
immagine: dettaglio-firma
ordine: 3
seo:
  titolo: Dichiarazione di successione a Monza | Monza CED
  descrizione: "Dichiarazione di successione a Monza: documenti, calcolo dell'imposta ed esenzioni. Prenota una consulenza con Monza CED o carica i documenti."
introduzione: |-
  Una successione arriva in un momento delicato, e le procedure fiscali e civili possono sembrare un ostacolo. Monza CED ti offre un servizio completo e gestisce con te ogni passaggio della dichiarazione di successione.
perChi:
  - Eredi
  - Legatari
  - Chi ha diritti sugli immobili ereditati
perChiNota: |-
  La dichiarazione va presentata **entro 12 mesi dalla data del decesso**.
cosaFacciamo:
  - Ti aiutiamo a individuare e raccogliere tutti i documenti, per evitare ritardi o errori.
  - Ti offriamo consulenza per calcolare correttamente l'imposta dovuta e individuare le esenzioni applicabili.
  - Seguiamo gli aspetti legati al versamento dell'imposta.
passaggi:
  - titolo: Raccolta dei documenti
    testo: Certificato di morte, atto di notorietà, elenco dei beni.
  - titolo: Dichiarazione e calcolo dell'imposta
    testo: Prepariamo la dichiarazione e calcoliamo l'imposta in base alla parentela e al valore dei beni.
  - titolo: Presentazione all'Agenzia delle Entrate
    testo: Le imposte vengono liquidate dall'Agenzia delle Entrate dopo la presentazione della dichiarazione.
